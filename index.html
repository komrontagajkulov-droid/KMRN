<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHOHIN AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #202123;
}

.app {
    height: 100vh;
    display: flex;
}

/* ЛЕВОЕ МЕНЮ */

.sidebar {
    width: 260px;
    background: #f7f7f8;
    border-right: 1px solid #ddd;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    padding: 10px;
    margin-bottom: 15px;
}

.new-chat {
    border: 1px solid #ccc;
    background: white;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    text-align: left;
}

.new-chat:hover {
    background: #eee;
}

.history {
    margin-top: 25px;
    color: #777;
    font-size: 13px;
}

.history-item {
    margin-top: 12px;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
}

.history-item:hover {
    background: #e8e8e8;
}

/* ОСНОВНАЯ ОБЛАСТЬ */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.header {
    height: 60px;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    padding: 0 25px;
    font-weight: bold;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 40px 20px 130px;
}

.welcome {
    text-align: center;
    margin-top: 18vh;
}

.welcome h1 {
    font-size: 34px;
    margin-bottom: 10px;
}

.welcome p {
    color: #777;
}

/* СООБЩЕНИЯ */

.message {
    max-width: 800px;
    margin: 20px auto;
    padding: 15px;
    border-radius: 10px;
    line-height: 1.5;
}

.user {
    background: #f3f3f3;
}

/* ПОЛЕ ВВОДА */

.input-container {
    position: fixed;
    bottom: 0;
    left: 260px;
    right: 0;
    background: white;
    border-top: 1px solid #eee;
    padding: 20px;
}

.input-box {
    max-width: 800px;
    margin: auto;
    display: flex;
    border: 1px solid #ccc;
    border-radius: 14px;
    padding: 8px;
    background: white;
}

.input-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    padding: 12px;
}

.send {
    border: none;
    background: #111;
    color: white;
    border-radius: 10px;
    padding: 0 20px;
    cursor: pointer;
}

.send:hover {
    opacity: 0.8;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .input-container {
        left: 0;
    }

    .welcome h1 {
        font-size: 27px;
    }

}

</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            SHOHIN AI
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ Новый чат
        </button>

        <div class="history">
            История
        </div>

        <div id="history"></div>

    </aside>


    <main class="main">

        <div class="header">
            SHOHIN AI
        </div>


        <div class="chat" id="chat">

            <div class="welcome" id="welcome">

                <h1>Чем я могу помочь?</h1>

                <p>
                    Ваш персональный AI-помощник
                </p>

            </div>

        </div>


        <div class="input-container">

            <div class="input-box">

                <input
                    id="message"
                    type="text"
                    placeholder="Напишите сообщение..."
                    onkeydown="handleEnter(event)"
                >

                <button
                    class="send"
                    onclick="sendMessage()"
                >
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>


<script>

let chats = [];


function sendMessage() {

    const input =
        document.getElementById("message");

    const text =
        input.value.trim();

    if (!text) return;


    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }


    const chat =
        document.getElementById("chat");


    const message =
        document.createElement("div");

    message.className =
        "message user";

    message.innerText =
        text;


    chat.appendChild(message);


    input.value = "";

    chat.scrollTop =
        chat.scrollHeight;


    chats.push(text);

    updateHistory();
}


function updateHistory() {

    const history =
        document.getElementById("history");

    history.innerHTML = "";

    chats.forEach(function(text) {

        const item =
            document.createElement("div");

        item.className =
            "history-item";

        item.innerText =
            text.substring(0, 30);

        history.appendChild(item);

    });

}


function newChat() {

    document.getElementById("chat").innerHTML = `

        <div class="welcome" id="welcome">

            <h1>Чем я могу помочь?</h1>

            <p>
                Ваш персональный AI-помощник
            </p>

        </div>

    `;

}


function handleEnter(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

}

</script>

</body>
</html>
