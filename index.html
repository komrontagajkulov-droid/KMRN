<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KMRN AI</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #ffffff;

            color: #202123;

            height: 100vh;

            overflow: hidden;
        }


        /* ================================
           ОСНОВНОЙ КОНТЕЙНЕР
        ================================= */

        .app {

            display: flex;

            width: 100%;

            height: 100vh;
        }


        /* ================================
           SIDEBAR
        ================================= */

        .sidebar {

            width: 260px;

            background: #f7f7f8;

            border-right: 1px solid #e5e5e5;

            padding: 16px;

            display: flex;

            flex-direction: column;
        }


        .logo {

            font-size: 22px;

            font-weight: 700;

            padding: 12px 10px 22px;

            color: #111827;
        }


        .new-chat {

            width: 100%;

            border: 1px solid #d9d9e0;

            background: white;

            border-radius: 10px;

            padding: 12px;

            font-size: 15px;

            cursor: pointer;

            text-align: left;

            margin-bottom: 15px;
        }


        .new-chat:hover {

            background: #eeeeef;
        }


        /* ================================
           MAIN
        ================================= */

        .main {

            flex: 1;

            display: flex;

            flex-direction: column;

            min-width: 0;

            height: 100vh;
        }


        .header {

            height: 60px;

            border-bottom: 1px solid #eeeeee;

            display: flex;

            align-items: center;

            padding: 0 24px;

            font-size: 18px;

            font-weight: 600;
        }


        /* ================================
           CHAT
        ================================= */

        .chat {

            flex: 1;

            overflow-y: auto;

            padding: 30px 20px 140px;
        }


        .message {

            max-width: 850px;

            margin: 0 auto 24px;

            line-height: 1.6;

            font-size: 16px;

            white-space: pre-wrap;
        }


        .user {

            background: #f4f4f4;

            padding: 12px 16px;

            border-radius: 14px;

            width: fit-content;

            max-width: 80%;

            margin-left: auto;
        }


        .assistant {

            width: 100%;

            padding: 5px 0;
        }


        .welcome {

            max-width: 850px;

            margin: 100px auto;

            text-align: center;
        }


        .welcome h1 {

            font-size: 32px;

            margin-bottom: 10px;
        }


        .welcome p {

            color: #666;

            font-size: 16px;
        }


        /* ================================
           INPUT AREA
        ================================= */

        .input-area {

            position: fixed;

            bottom: 0;

            left: 260px;

            right: 0;

            background: linear-gradient(
                to top,
                #ffffff 75%,
                rgba(255,255,255,0)
            );

            padding: 20px;
        }


        .input-box {

            max-width: 850px;

            margin: 0 auto;

            display: flex;

            align-items: flex-end;

            gap: 10px;

            border: 1px solid #d9d9e0;

            border-radius: 16px;

            background: #ffffff;

            padding: 10px 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.05);
        }


        textarea {

            flex: 1;

            border: none;

            outline: none;

            resize: none;

            font-family: inherit;

            font-size: 16px;

            min-height: 24px;

            max-height: 160px;

            padding: 6px;
        }


        textarea::placeholder {

            color: #999;
        }


        .send {

            width: 40px;

            height: 40px;

            border: none;

            border-radius: 10px;

            background: #111827;

            color: white;

            cursor: pointer;

            font-size: 18px;
        }


        .send:hover {

            background: #000000;
        }


        .send:disabled {

            opacity: 0.5;

            cursor: default;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .sidebar {

                display: none;
            }


            .input-area {

                left: 0;

                padding: 12px;
            }


            .header {

                padding: 0 16px;
            }


            .chat {

                padding-left: 15px;

                padding-right: 15px;

                padding-bottom: 130px;
            }


            .user {

                max-width: 90%;
            }


            .welcome {

                margin-top: 80px;
            }


            .welcome h1 {

                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- ================================
         SIDEBAR
    ================================= -->

    <aside class="sidebar">

        <div class="logo">
            KMRN AI
        </div>


        <button
            class="new-chat"
            id="newChat"
        >
            ＋ Новый чат
        </button>

    </aside>


    <!-- ================================
         MAIN
    ================================= -->

    <main class="main">


        <header class="header">
            KMRN AI
        </header>


        <section
            class="chat"
            id="chat"
        >

            <div
                class="welcome"
                id="welcome"
            >

                <h1>
                    Чем я могу помочь?
                </h1>

                <p>
                    Задайте любой вопрос KMRN AI
                </p>

            </div>

        </section>


        <!-- ============================
             INPUT
        ============================= -->

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Сообщить KMRN AI..."
                    rows="1"
                ></textarea>


                <button
                    class="send"
                    id="sendButton"
                    title="Отправить"
                >
                    ↑
                </button>

            </div>

        </div>


    </main>

</div>


<script>


// ========================================
// ELEMENTS
// ========================================

const chat =
    document.getElementById("chat");

const welcome =
    document.getElementById("welcome");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const newChat =
    document.getElementById("newChat");


// ========================================
// ДОБАВЛЕНИЕ СООБЩЕНИЯ
// ========================================

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        `message ${type}`;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;

    return message;
}


// ========================================
// ОТПРАВКА
// ========================================

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    // Убираем приветственный экран

    if (welcome) {

        welcome.remove();

    }


    // Сообщение пользователя

    addMessage(
        message,
        "user"
    );


    // Очищаем поле

    input.value = "";

    input.style.height = "auto";


    // Блокируем кнопку

    sendButton.disabled = true;


    // Создаём сообщение AI

    const aiMessage =
        addMessage(
            "KMRN AI печатает...",
            "assistant"
        );


    try {


        // ====================================
        // ЗАПРОС К SERVER.JS
        // ====================================

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                }
            );


        // Получаем JSON

        const data =
            await response.json();


        // ====================================
        // ОШИБКА СЕРВЕРА
        // ====================================

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Ошибка сервера KMRN AI"
            );

        }


        // ====================================
        // ОТВЕТ AI
        // ====================================

        if (
            typeof data.answer !== "string" ||
            !data.answer.trim()
        ) {

            throw new Error(
                "KMRN AI не вернул ответ"
            );

        }


        aiMessage.textContent =
            data.answer;


    } catch (error) {


        console.error(
            "KMRN AI ERROR:",
            error
        );


        aiMessage.textContent =
            "Ошибка: " +
            error.message;


    } finally {


        sendButton.disabled =
            false;


        input.focus();


        chat.scrollTop =
            chat.scrollHeight;

    }

}


// ========================================
// КНОПКА ОТПРАВИТЬ
// ========================================

sendButton.addEventListener(
    "click",
    sendMessage
);


// ========================================
// ENTER
// ========================================

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


// ========================================
// АВТОВЫСОТА TEXTAREA
// ========================================

input.addEventListener(
    "input",
    function() {

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                160
            ) + "px";

    }
);


// ========================================
// НОВЫЙ ЧАТ
// ========================================

newChat.addEventListener(
    "click",
    function() {

        chat.innerHTML = `

            <div
                class="welcome"
                id="welcome"
            >

                <h1>
                    Чем я могу помочь?
                </h1>

                <p>
                    Задайте любой вопрос KMRN AI
                </p>

            </div>

        `;

    }
);


// ========================================
// ФОКУС
// ========================================

input.focus();


</script>


</body>

</html>
