<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KMRN AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #202123;
        }

        .app {
            height: 100vh;
            display: flex;
        }

        /* SIDEBAR */

        .sidebar {
            width: 260px;
            background: #f7f7f8;
            border-right: 1px solid #ddd;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 15px;
        }

        .new-chat {
            border: 1px solid #ccc;
            background: white;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
        }

        .new-chat:hover {
            background: #eee;
        }

        .history {
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }

        .history-item {
            margin-top: 10px;
            padding: 9px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #e8e8e8;
        }


        /* MAIN */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            height: 60px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-weight: bold;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px 130px;
        }


        /* WELCOME */

        .welcome {
            text-align: center;
            margin-top: 18vh;
        }

        .welcome h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #777;
        }


        /* MESSAGES */

        .message {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user {
            background: #f3f3f3;
        }

        .ai {
            background: white;
        }


        /* INPUT */

        .input-container {
            position: fixed;
            bottom: 0;
            left: 260px;
            right: 0;
            background: white;
            border-top: 1px solid #eee;
            padding: 20px;
        }

        .input-box {
            max-width: 800px;
            margin: auto;
            display: flex;
            border: 1px solid #ccc;
            border-radius: 14px;
            padding: 8px;
            background: white;
        }

        .input-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 12px;
            min-width: 0;
        }

        .send {
            border: none;
            background: #111;
            color: white;
            border-radius: 10px;
            padding: 0 20px;
            cursor: pointer;
            font-size: 18px;
        }

        .send:hover {
            opacity: 0.8;
        }

        .send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .sidebar {
                display: none;
            }

            .input-container {
                left: 0;
                padding: 10px;
            }

            .chat {
                padding-left: 10px;
                padding-right: 10px;
            }

            .message {
                margin: 15px auto;
            }

            .welcome h1 {
                font-size: 27px;
            }

            .header {
                padding: 0 15px;
            }

        }

    </style>

</head>


<body>

<div class="app">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            KMRN AI
        </div>

        <button
            class="new-chat"
            onclick="newChat()"
        >
            ＋ Новый чат
        </button>

        <div class="history">
            История
        </div>

        <div id="history"></div>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <div class="header">
            KMRN AI
        </div>


        <div
            class="chat"
            id="chat"
        >

            <div
                class="welcome"
                id="welcome"
            >

                <h1>
                    Чем я могу помочь?
                </h1>

                <p>
                    Ваш персональный AI-помощник
                </p>

            </div>

        </div>


        <!-- INPUT -->

        <div class="input-container">

            <div class="input-box">

                <input
                    id="message"
                    type="text"
                    placeholder="Напишите сообщение..."
                    autocomplete="off"
                    onkeydown="handleEnter(event)"
                >

                <button
                    id="sendButton"
                    class="send"
                    onclick="sendMessage()"
                >
                    ↑
                </button>

            </div>

        </div>


    </main>

</div>


<script>


let chats = [];

let isSending = false;


/* SEND MESSAGE */

async function sendMessage() {

    if (isSending) {
        return;
    }


    const input =
        document.getElementById("message");


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    isSending = true;


    const button =
        document.getElementById("sendButton");


    button.disabled = true;


    const welcome =
        document.getElementById("welcome");


    if (welcome) {
        welcome.remove();
    }


    const chat =
        document.getElementById("chat");


    /* USER MESSAGE */

    const userMessage =
        document.createElement("div");


    userMessage.className =
        "message user";


    userMessage.innerText =
        text;


    chat.appendChild(userMessage);


    input.value = "";


    /* AI MESSAGE */

    const aiMessage =
        document.createElement("div");


    aiMessage.className =
        "message ai";


    aiMessage.innerText =
        "KMRN AI думает...";


    chat.appendChild(aiMessage);


    chat.scrollTop =
        chat.scrollHeight;


    try {


        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Server error:",
                errorText
            );

            aiMessage.innerText =
                "Ошибка сервера KMRN AI.";

            return;
        }


        if (!response.body) {

            aiMessage.innerText =
                "Сервер не вернул поток данных.";

            return;
        }


        /* READ STREAM */

        const reader =
            response.body.getReader();


        const decoder =
            new TextDecoder();


        let buffer = "";

        let answer = "";


        aiMessage.innerText = "";


        while (true) {


            const result =
                await reader.read();


            if (result.done) {
                break;
            }


            buffer +=
                decoder.decode(
                    result.value,
                    {
                        stream: true
                    }
                );


            /*
             * Gemini SSE contains
             * lines beginning with:
             * data:
             */

            const lines =
                buffer.split("\n");


            buffer =
                lines.pop();


            for (
                const line of lines
            ) {


                const trimmed =
                    line.trim();


                if (
                    !trimmed ||
                    !trimmed.startsWith("data:")
                ) {
                    continue;
                }


                const jsonText =
                    trimmed
                        .substring(5)
                        .trim();


                try {


                    const data =
                        JSON.parse(jsonText);


                    const parts =
                        data.candidates?.[0]
                            ?.content?.parts;


                    if (parts) {


                        for (
                            const part of parts
                        ) {


                            if (
                                part.text
                            ) {

                                answer +=
                                    part.text;

                                aiMessage.innerText =
                                    answer;

                                chat.scrollTop =
                                    chat.scrollHeight;
                            }

                        }

                    }


                } catch (error) {

                    console.log(
                        "Waiting for complete JSON chunk..."
                    );

                }

            }

        }


        if (!answer) {

            aiMessage.innerText =
                "Gemini не вернул текстовый ответ.";

        }


    } catch (error) {


        console.error(
            "Connection error:",
            error
        );


        aiMessage.innerText =
            "Ошибка подключения к KMRN AI.";


    } finally {


        isSending = false;

        button.disabled = false;

        input.focus();


    }


    chats.push(text);

    updateHistory();

}


/* HISTORY */

function updateHistory() {


    const history =
        document.getElementById(
            "history"
        );


    history.innerHTML = "";


    chats.forEach(
        function(text) {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "history-item";


            item.innerText =
                text.substring(
                    0,
                    30
                );


            history.appendChild(
                item
            );


        }
    );

}


/* NEW CHAT */

function newChat() {


    document.getElementById(
        "chat"
    ).innerHTML = `

        <div
            class="welcome"
            id="welcome"
        >

            <h1>
                Чем я могу помочь?
            </h1>

            <p>
                Ваш персональный AI-помощник
            </p>

        </div>

    `;

}


/* ENTER */

function handleEnter(event) {


    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


</script>


</body>

</html>
